# Release archives per RID for a v<version> tag (plan/T3). Each OS runner publishes its RIDs
# with NativeAOT, packs rtok-<rid>.tar.gz (.zip on Windows) with the package-release build task and
# smoke-tests the unpacked archive. The last job creates a draft GitHub release with every
# archive and SHA256SUMS; publishing the draft and `ketch push` (ketch.toml) stay manual.
# Dispatch runs the same build without a release. Actions are pinned to commit SHAs.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: macos-arm64
            os: macos-15
            rids: osx-arm64 osx-x64
          - name: ubuntu-x64
            os: ubuntu-24.04
            rids: linux-x64 linux-musl-x64
          - name: ubuntu-arm64
            os: ubuntu-24.04-arm
            rids: linux-arm64
          - name: windows-x64
            os: windows-2025
            rids: win-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      RIDS: ${{ matrix.rids }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Tag matches the version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(dotnet msbuild src/Rtok.Cli/Rtok.Cli.csproj -getProperty:Version -p:Configuration=Release)
          if [ "$TAG" != "v$version" ]; then
            echo "tag $TAG does not match the version $version" >&2
            exit 1
          fi
      - name: Tools
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang zlib1g-dev
      - name: Publish (AOT)
        run: |
          dotnet build eng/Rtok.Build -c Release
          for rid in $RIDS; do dotnet run --project eng/Rtok.Build -c Release --no-build -- --target=publish --rid="$rid"; done
      - name: Pack
        run: |
          native=${RIDS%% *}
          for rid in $RIDS; do
            dotnet run --project eng/Rtok.Build -c Release --no-build -- --target=package-release --rid="$rid" --rtok="artifacts/dist/$native/rtok"
          done
      - name: Smoke the archives
        run: |
          mkdir -p artifacts/unpacked
          for rid in $RIDS; do
            if [ "$RUNNER_OS" = Windows ]; then
              7z x -bso0 -oartifacts/unpacked "artifacts/release/rtok-$rid.zip"
            else
              tar -C artifacts/unpacked -xzf "artifacts/release/rtok-$rid.tar.gz"
            fi
            dotnet run --project eng/Rtok.Build -c Release --no-build -- --target=smoke --rid="$rid" --dir="artifacts/unpacked/rtok-$rid"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.name }}
          path: |
            artifacts/release/rtok-*.tar.gz
            artifacts/release/rtok-*.zip
            artifacts/release/rtok-*.sha256
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the draft release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Marketplace catalogs
        run: dotnet run --project eng/Rtok.Build -- --target=check-marketplace --strict
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Every RID is there
        run: |
          for rid in osx-arm64 osx-x64 linux-x64 linux-arm64 linux-musl-x64; do
            test -f "dist/rtok-$rid.tar.gz"
          done
          test -f dist/rtok-win-x64.zip
          cd dist && cat ./*.sha256 > SHA256SUMS && sha256sum -c SHA256SUMS
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --draft --verify-tag --title "rtok $TAG" --generate-notes \
            dist/rtok-* dist/SHA256SUMS
