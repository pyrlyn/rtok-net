# Publishes one own package per <Name>/v<version> tag (packages/README.md).
name: packages

on:
  push:
    tags: ["Pyrlyn.*/v*", "Rtok.*/v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write # NuGet trusted publishing: a short-lived key, no stored secret.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Dry run
        run: eng/publish-package.sh "$GITHUB_REF_NAME" --dry-run
      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish
        run: eng/publish-package.sh "$GITHUB_REF_NAME"
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
