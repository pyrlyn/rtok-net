[setup.windsurf]                      # Cascade's `mcp_config.json`
# config_path = "~/.codeium/windsurf/mcp_config.json" # Cascade's `mcp_config.json`

[setup.zed]                           # Zed's `settings.json` carries `context_servers`
# config_path = "~/.config/zed/settings.json" # Zed's `settings.json` carries `context_servers`

[setup.cline]                         # Cline's hooks folder, shared by the CLI and the extension, and its MCP settings file
# hooks_path = "~/Documents/Cline/Hooks" # Cline's hooks folder
# mcp_path   = "~/.cline/data/settings/cline_mcp_settings.json" # CLI; the extension uses the VS Code globalStorage settings file

[setup.gemini]                        # Gemini CLI's `settings.json` (`hooks`, `mcpServers`) lives under `dir`
# dir = "~/.gemini"                     # settings.json (hooks, mcpServers)

[setup.codewhale]                     # CodeWhale's `config.toml` (`[[hooks.hooks]]`) and sibling `mcp.json` live under `dir`; `$CODEWHALE_HOME` moves it
# dir = "~/.codewhale"                  # config.toml ([[hooks.hooks]]), mcp.json (mcpServers)

[setup.mimo]                          # MiMo Code's `mimocode.json` (`mcp`), the OpenCode-fork config file; `MIMOCODE_HOME` or `MIMOCODE_CONFIG` moves it
# config_path = "~/.config/mimocode/mimocode.json" # mcp (OpenCode-fork shape)

[setup.antigravity]                   # Antigravity: the IDE plugin root, where rtok links `plugins/antigravity`, and the CLI's staged-plugin root, written only by `agy plugin install`
# plugins_path = "~/.gemini/config/plugins" # Antigravity 2.0 / IDE: plugins/antigravity linked here
# cli_plugins_path = "~/.gemini/antigravity-cli/plugins" # agy plugin install stages here; read only

[setup.devin]                         # Devin CLI and Desktop
# config_path = "~/.config/devin/config.json" # mcp_config.json is read beside it; Windows: %APPDATA%\devin\

[setup.roo]                           # Roo Code's global `mcp_settings.json`
# mcp_path = ""                         # empty: <Code user dir>/globalStorage/rooveterinaryinc.roo-cline/settings/mcp_settings.json

[setup.junie]                         # Junie CLI's user `mcp.json`
# mcp_path = ""                         # empty: ~/.junie/mcp/mcp.json (Junie CLI user MCP file)

[setup.qwen]                          # Qwen Code's `settings.json` (`hooks`, `mcpServers`) lives under `dir`
# dir = "~/.qwen"                       # settings.json (hooks, mcpServers); QWEN_HOME moves the directory

[setup.codebuddy]                     # CodeBuddy Code's config directory: `settings.json` (`hooks`), the MCP file, `plugins/`
# dir = "~/.codebuddy"                  # CodeBuddy Code: settings.json (hooks), .mcp.json, plugins/; CODEBUDDY_CONFIG_DIR moves it
# workbuddy_dir = "~/.workbuddy"        # WorkBuddy Desktop: the same files (embedded CodeBuddy Code; unverified)

[setup.goose]                         # Goose's `config.yaml`, where `extensions.rtok` goes
# config_path = "~/.config/goose/config.yaml" # Goose CLI and Desktop: extensions.rtok; Windows: %APPDATA%/Block/goose/config/config.yaml; GOOSE_PATH_ROOT: <root>/config/config.yaml

[setup.droid]                         # Factory Droid's user-level MCP file
# mcp_path = "~/.factory/mcp.json"      # Factory Droid: user-level MCP servers (mcpServers)

[setup.kiro]                          # Kiro IDE and CLI user-level MCP file
# mcp_path = "~/.kiro/settings/mcp.json" # Kiro IDE and CLI: user-level MCP servers (mcpServers)

[setup.amp]                           # Amp (Sourcegraph) user settings file (`amp.mcpServers`)
# settings_path = "~/.config/amp/settings.json" # Amp: user settings; amp.mcpServers holds MCP servers (settings.jsonc if it is the only one)

[setup.warp]                          # Warp's user-level MCP file
# mcp_path = "~/.warp/.mcp.json"        # Warp: user-level MCP servers (mcpServers)

[setup.continue]                      # Continue's user `config.yaml`, where the `rtok` item of `mcpServers` goes
# config_path = "~/.continue/config.yaml" # Continue (VS Code, JetBrains, cn): mcpServers item rtok; Windows: %USERPROFILE%/.continue/; CONTINUE_GLOBAL_DIR moves it

[setup.crush]                         # Crush's global JSON config
# config_path = "~/.config/crush/crush.json" # Crush: global JSON config (mcp.rtok); CRUSH_GLOBAL_CONFIG or XDG_CONFIG_HOME move it

[setup.openhands]                     # OpenHands's user-level MCP file
# mcp_path = "~/.openhands/mcp.json"    # OpenHands: user-level MCP servers (mcpServers)

[setup.augment]                       # the Auggie CLI's user settings file
# settings_path = "~/.augment/settings.json" # Auggie CLI: user settings, mcpServers

[setup.reasonix]                      # Reasonix home (`REASONIX_HOME`, `%APPDATA%\reasonix` on Windows): `config.toml` holds the `[[plugins]]` MCP servers
# dir = "~/.reasonix"                   # Reasonix: config.toml ([[plugins]] MCP servers); REASONIX_HOME moves it (Windows: %APPDATA%/reasonix)

[expand]                              # rtok expand <id>
# max_lines = 0                         # 0 = unlimited (--lines a-b is per call)
# max_rate  = 0.05                      # re-read ceiling; above it the report flags lossy compression

[filter]                              # rtok filter --stdin
# cmd = ""                              # command family hint when the caller knows it (--cmd)

[worktree]                            # rtok worktree add | list | gc
# enabled = true                        # false: rtok worktree and MCP worktree_* are off; Claude's worktree hooks act as without rtok
# root    = ".rtok/worktrees"           # where `rtok worktree add` creates worktrees, as <root>/<repo>-<task>; relative: under the main checkout

[tasks]                               # task adapters; usually set per project in .rtok.toml
# adapter = "disk"                      # disk | github | gitlab
# prefix  = ""                          # task id prefix (R → R12); empty: first letter of the project name

[tasks.disk]                          # one Markdown file per task
# dir = "tasks"                         # one Markdown file per task, relative to the project root; done ones go to <dir>/done

[tasks.github]                        # GitHub Issues, sub-issues and a Projects v2 Status field
# repo    = ""                          # owner/name; empty: the origin remote
# project = 0                           # repo owner's Projects v2 number: issues join it and its Status follows the task; 0 = issues only

[tasks.gitlab]                        # GitLab Issues with `status::` labels
# url     = "https://gitlab.com"        # https base URL; set it for a self-hosted instance
# project = ""                          # group/name or numeric id; empty: the origin remote

[tasks.export.github]                 # `rtok task export github`: mirror the disk tasks into GitHub Issues, one way
# repo = ""                             # owner/name; empty: [tasks.github] repo, else the origin remote

[tasks.export.linear]                 # `rtok task export linear`: mirror the disk tasks into Linear, one way; token in LINEAR_API_KEY
# team = ""                             # the team's short key, e.g. "ENG"; empty: the export refuses to run

[otel]                                # OpenTelemetry export; off until endpoint resolves
# endpoint     = ""                     # OTLP/HTTP base URL, e.g. "http://localhost:4318"; "" = $OTEL_EXPORTER_OTLP_ENDPOINT
# headers      = ""                     # "k=v,k2=v2", e.g. "signoz-ingestion-key=…"; "" = $OTEL_EXPORTER_OTLP_HEADERS
# service_name = "rtok"                 # resource service.name
# content      = true                   # gen_ai.input/output.messages, tool arguments and results on spans
# content_bytes = 65536                 # per attribute; beyond it rtok.archive.id → `rtok expand <id>`
# flush_secs   = 5                      # proxy / mcp flush interval, and the POST timeout

[plugins.measure]                     # the measure plugin
# enabled = true                        # false = the measure plugin is off

[plugins.cmd]                         # shell command output: `rtok run` and the Bash hook
# enabled    = true                     # filter command output
# rewrite    = true                     # PreToolUse(Bash) → `rtok run -- …`
# shell      = ""                       # "" = $SHELL
# rules      = "~/.rtok/rules.toml"     # extra filter rules; missing → built-in rules/default.toml
# rules_dir  = "~/.rtok/rules.d"        # drop-ins: every *.toml merges after rules in name order
# trailer    = true                     # print `[rtok <id12> · N lines]` after a cut; false = `--no-ref`
# trailer_min_lines = 40                # add `[rtok <id12> · N lines]` above this
# fail_tail_lines = 80                  # non-zero exit → last N lines verbatim
# never_wrap = ["rtok", "sudo"]         # first-word deny list; heredocs, `&` are always skipped
# interactive_stems = ["python", "node", "psql", "sqlite3", "irb", "bash", "sh", "zsh", "docker", "kubectl"] # `-i` skips wrap only for these (docker: run/exec; kubectl: exec); `--interactive` always skips

[plugins.read]                        # the read, search and tree tools, and the native Read advice
# enabled      = true                   # the read, search and tree tools
# default_mode = "full"                 # full | lines | map | signatures
# max_chars    = 20000                  # above this, head/tail + archive id
# native_max_bytes = 32768              # PreToolUse(Read) deny threshold; never below this
# range_max_lines = 300                 # a native Read with limit 1..=N passes the hook; 0 = unranged only
# advice       = true                   # false = never deny native Read
# allow_paths  = []                     # extra roots outside cwd
# search_max   = 50                     # search hit ceiling
# search_max_bytes = 1048576            # search skips files larger than this
# tree_depth   = 2                      # tree depth when none is given
# delta        = true                   # changed re-read → unified diff vs last archive
# delta_max_ratio = 0.6                 # full file when the diff is not below this fraction
# languages    = []                     # Deprecated compatibility key

[plugins.json_tree]                   # nested JSON folding in old tool results
# enabled = false                       # fold repeated nested JSON in old tool results; off until a measurement shows a saving

[plugins.archive]                     # large tool results in proxied requests, archived for `rtok expand`
# enabled    = true                     # archive large tool results in proxied requests
# keep_turns = 4                        # never touch the last N turns
# min_tokens = 1500                     # only rewrite tool results above this (estimated)
# head_lines = 8                        # lines kept from the start of an archived result
# tail_lines = 4                        # lines kept from the end of an archived result
# tiers      = false                    # optional L0/L1/L2 depth (OpenViking spec, AGPL-3.0 — rtok does not vendor/link/subprocess; native implementation)
# live_blobs = false                    # shrink nested JSON dumps + data: blobs in user blocks, never results/system/tools/last-2-turns (opt-in)
# skills     = false                    # opt-in skill body archiving outside the live zone

[plugins.proxy]                       # the usage-capture plugin, not the `[proxy]` server
# enabled = true                        # the proxy plugin (usage capture); the server itself is [proxy]

[plugins.proxy.semantic_cache]        # opt-in response cache
# enabled      = false                  # off until the cache passes its audit
# threshold    = 0.99                   # cosine similarity; semantic tier only
# ttl_s        = 300                    # seconds a cached reply stays fresh
# max_messages = 1                      # bifrost uses 3; start stricter for agents
# require_empty_tools = true            # cache only requests without tools
# embed_backend = "hash"                # "hash" = direct tier only until embeddings
# cache_by_model = true                 # the model is part of the cache key
# cache_by_provider = true              # the provider is part of the cache key

[plugins.inject]                      # modes and context injected at session start
# enabled   = true                      # inject modes and context at session start
# budget_tokens = 800                   # per turn, all injections together
# modes_dir = "~/.rtok/modes"           # where mode files live
# modes     = []                        # same as [setup].modes; setup writes here

[plugins.guard]                       # repeated or wasteful tool calls
# enabled      = true                   # deny repeated or wasteful tool calls
# window_turns = 8                      # turns a repeated call is remembered
# deny_grep_glob = false                # opt-in: deny native Grep/Glob, point at MCP search/tree
# grep_symbol  = false                  # opt-in: answer a Grep for one identifier with its indexed definitions
# skills       = false                  # Opt-in: on `PreToolUse(Skill)` a `SKILL.md` over `skill_max_bytes` is archived and denied with its markdown map plus the `expand` pointer, unless its frontmatter carries a key the host applies on invocation
# skill_max_bytes = 8192                # skill bodies above this are flagged

[plugins.memory]                      # session memory and recall
# enabled      = true                   # session memory and recall
# recall_titles = 5                     # SessionStart: last N titles + ids
# recall_tokens = 200                   # token budget of the recall block
# prompt_recall = 5                     # UserPromptSubmit: 0 = off; N = ranked titles per turn
# checkpoint_tokens = 400               # PreCompact → SessionStart(compact)
# search_limit = 5                      # memory search hit ceiling
# sync_tokens  = 300                    # rtok memory sync: CLAUDE.md / AGENTS.md block
# startup_recall = true                 # SessionStart(startup) restores newest session:* note
# handoff      = true                   # sub-agent digest MCP tool
# spawn_brief  = true                   # SubagentStart pointer digest
# spawn_brief_tokens = 300              # token budget for the spawn brief
# admit        = true                   # mem_save refuses a too-short or duplicate note
# admit_min_chars = 5                   # shortest body the gate admits
# admit_similarity = 85                 # percent trigram overlap that counts as a duplicate
# forget_after_days = 90                # `memory forget` retires notes unread this long; 0 = needs --days

[plugins.memory.embed]                # optional vector search beside FTS5
# enabled     = false                   # FTS5-only when false; vector search is opt-in
# provider    = "local"                 # "local" = offline hash vectors | "http" = an OpenAI-compatible embeddings API
# model       = "all-MiniLM-L6-v2"      # with "http": the endpoint's model name
# dimensions  = 384                     # with "http": must equal the endpoint's vector length
# hybrid      = true                    # when enabled: RRF(fts5, knn) for mem_search and prompt_recall; the hook reads stored vectors only; false = knn only
# url         = ""                      # "http": base URL, e.g. "http://localhost:11434/v1" (Ollama) or "https://api.openai.com/v1"; note text is sent there
# api_key_env = ""                      # "http": name of the env var holding the key; empty = no Authorization header
# max_chars   = 8000                    # "http": a longer text is never sent (the note search runs instead)

[plugins.memory.extract]              # `rtok memory extract` turns a transcript into notes through a program of the user's choosing
# enabled   = false                     # rtok memory extract: off by default, a model call can cost money
# command   = []                        # program reading the transcript on stdin, one {"title","body"} JSON line out per note
# max_notes = 5                         # notes kept per run
# max_input_bytes = 60000               # transcript bytes sent to the program; the end of the session is kept

[plugins.graph]                       # the code graph and its tools
# enabled    = true                     # the code graph and its tools
# max_tokens = 2000                     # per response; beyond it: head + "N more, expand <id>"
# impact_tokens = 1500                  # impact: files grouped and ranked up to this budget, then "+K files, M refs not shown"; --all or 0 = every row
# map_tokens = 0                        # SessionStart repo map cap (counts toward the injection budget next to memory.recall_tokens); 0 = off
# map_rank   = "refs"                   # SessionStart map order: refs = references per name; pagerank = files by personalized PageRank, personalized by recently edited files and the last checkpoint after a compact
# body_lines = 40                       # symbol(): source lines shown per definition
# auto_index = true                     # every symbol/callers/impact call walks the tree; false = index once, then `rtok graph index` or the watcher
# auto_add_projects = true              # index a project the first time a session opens in it
# backend    = "tags"                   # tags | lsp | auto | text: tags = tree-sitter index (default); lsp = language server from PATH, tags when it cannot answer; auto = per project and language, server first, tags second, text search when no grammar parses the project; text = in-process text search only (no call graph, no dead)
# lsp_timeout_ms = 40000                # how long one language-server wait (starting, still indexing) may take before the request falls back to tags
# watch      = "off"                    # off | notify: background re-index inside `rtok mcp`
# auto_link_references = true           # follow references in manifests (Cargo path, npm file:/link:, go replace, Python path, submodules) into other directories, register and auto-link them
# reference_depth = 3                   # reference levels followed from the project (A -> B is 1); reaching it is shown and logged
# max_auto_projects = 20                # most projects references may add to the registry; reaching it is shown and logged
# alerts     = true                     # alert when a project in the scope is missing, unreachable, has its backend down or a broken manifest link; shown by rtok doctor, graph projects and graph answers
# health_check_interval_s = 60          # seconds between health checks in rtok mcp and rtok web (an alert needs two in a row); 0 = off
# live_heat_window_s = 300              # seconds a node stays warm on the live graph canvas after a call (rtok web, rtok tui)
# live_max_events_per_s = 50            # most call events the live panel lists per second; the counters still count every call
# live_feed_rows = 200                  # finished calls the live feed keeps
# exclude    = []                       # gitignore-style paths dropped from the walk
# include    = []                       # gitignore-style paths forced back in

[plugins.graph.backend_by_language]   # backend for one language, e.g. { go = "tags", rust = "lsp" }

[plugins.graph.extensions]            # ext = "grammar" remap for custom suffixes

[plugins.toon]                        # uniform JSON arrays rewritten as TOON
# enabled  = true                       # rewrite uniform JSON arrays as TOON
# min_rows = 5                          # arrays shorter than this stay JSON

[plugins.compress]                    # summaries of archived tool output
# enabled = true                        # extractive summaries of archived tool output; runs only in proxy.mode = "compress"

[plugins.compress.llm]                # compressor, off by default
# enabled   = false                     # model summaries of archived output via the internal lane; needs proxy.mode = "compress"
# url       = ""                        # where the compressor posts; empty = this proxy (proxy.bind:proxy.port)
# model     = "claude-haiku-4-5"        # model that writes the summaries
# max_input_bytes = 65536               # larger archived results keep the extractive view
# max_output_tokens = 512               # summary length cap
# max_spans = 64                        # more must-keep spans than this keep the extractive view
# max_in_flight = 2                     # compressor calls at once
# timeout_s = 60                        # seconds per compressor call
# code      = false                     # also summarise diffs and source; off = logs and prose only

[plugins.docs]                        # local Rust crate docs
# enabled     = false                   # local rustdoc from Cargo.lock + cached docs.rs JSON
# query_limit = 5                       # docs_query hit ceiling
# snippet_chars = 400                   # chars per FTS snippet
# max_tokens  = 800                     # whole-reply estimate cap

[plugins.wasm]                        # out-of-tree `.wasm` plugin host
# enabled = false                       # load out-of-tree WASM plugins
# dir     = "~/.rtok/plugins"           # where WASM plugins live
