[report]                              # rtok report (renders the operator model, computes nothing)
# format = "md"                         # md; html, pdf, --ai
# out    = ""                           # "" = stdout (--out <path>)
# since  = "30d"                        # how far back the report reads
# ai     = false                        # model-shaped rendering instead of --format (--ai)
# budget_tokens = 8000                  # --ai drops whole sections past this

[bench]                               # rtok bench
# tasks     = "bench/tasks.toml"        # the task file
# runs      = 3                         # runs per task and config
# dry_run   = false                     # print the plan and run nothing
# timeout_s = 900                       # per task run
# suite     = ""                        # "" = the six default tasks; "graph" = with and without MCP

[bench.configs]                       # free-form `name = settings file` pairs
# a = "bench/configs/legacy.json"
# b = "bench/configs/rtok.json"

[doctor]                              # rtok doctor
# settings_path = "~/.claude/settings.json" # Claude Code settings doctor reads
# claude_json  = "~/.claude.json"       # Claude Code's user state file
# mcp_json     = ".mcp.json"            # project MCP servers file
# probe_timeout_ms = 500                # per proxy hop /health probe
# mcp_timeout_ms = 15000                # per MCP server tools/list (uvx/npx servers start slowly)
# instruction_warn_tokens = 1000        # --instructions: flag files above this
# instructions = false                  # run the instruction audit by default (--instructions)
# tools_rewrite_min_desc_tokens = 2000  # when [proxy.tools_rewrite] is suggested

[setup]                               # rtok agents install / remove <host>
# dry_run      = false                  # print what install would change and write nothing
# yes          = false                  # required by --replace
# backup       = true                   # _backup/<name>.bak-<ts> beside each file, before install and uninstall touch it
# backup_files = 5                      # .bak-* generations kept per file; older ones are deleted (0 = keep all)
# hook_timeout_s = 5                    # timeout written into each hook entry
# modes        = []                     # e.g. ["terse", "yagni"] (--mode)
# mcp          = true                   # also register the MCP server (--mcp)
# proxy        = false                  # also set the base URL (--proxy)
# force        = false                  # `agents update --force`: reinstall the host plugin even when the version decision would otherwise skip it

[setup.claude]                        # Claude Code's user `settings.json`
# settings_path = "~/.claude/settings.json" # hooks and the MCP server go here

[setup.cursor]                        # Cursor's user `hooks.json`
# hooks_path = "~/.cursor/hooks.json"   # rtok's hook entries go here

[setup.codex]                         # Codex's `config.toml`
# config_path = "~/.codex/config.toml"  # hooks and the MCP server go here

[setup.opencode]                      # OpenCode's `opencode.json`
# config_path = "~/.config/opencode/opencode.json" # the MCP server and plugin go here

[setup.kilo]                          # `kilo.json`, merged by Kilo with a user's `kilo.jsonc`
# config_path = "~/.config/kilo/kilo.json" # kilo.jsonc is merged by Kilo, never rewritten

[setup.pi]                            # pi: the linked rtok extension
# extensions_path = "~/.pi/agent/extensions" # pi's extensions folder
# tools = false                         # pi.registerTool for read/search/graph/memory

[setup.omp]                           # oh my pi: the linked pi extension and native `mcp.json`
# extensions_path = "~/.omp/agent/extensions" # oh my pi: plugins/pi is linked here
# mcp_path = "~/.omp/agent/mcp.json"    # omp's MCP servers file

[setup.zcode]                         # Z Code's `config.json`
# config_path = "~/.zcode/cli/config.json" # the MCP server goes here

[setup.kimi]                          # `mcp.json` is read beside `config_path`
# config_path = "~/.kimi-code/config.toml" # mcp.json is read beside it

[setup.grok]                          # Grok Build's `config.toml`
# config_path = "~/.grok/config.toml"   # Grok Build's `config.toml`

[setup.vscode]                        # profile `mcp.json` under Code / Code - Insiders user dirs
# code_user_dir = ""                    # VS Code's user folder; "" = the platform default
# insiders_user_dir = ""                # VS Code Insiders' user folder; "" = the platform default

[setup.copilot]                       # `mcp-config.json` and `hooks/rtok.json` live under `dir`
# dir = "~/.copilot"                    # mcp-config.json, hooks/rtok.json

[setup.commandcode]                   # hooks merge into `settings.json`, MCP into `mcp.json`
# dir = "~/.commandcode"                # settings.json (hooks key), mcp.json

[setup.aider]                         # `.aider.conf.yml` carries `openai-api-base`
